    // ========== 核心计算函数 ==========
    function calculateUserCoords(){
        let sl=0,sx=0,sb=0,sg=0, ml=0,mx=0,mb=0,mg=0;
        answers.forEach(a=>{
            const w=a.weights;
            if(w.laichu!==undefined){ sl += w.laichu; ml++; }
            if(w.xingjing!==undefined){ sx += w.xingjing; mx++; }
            if(w.bian!==undefined){ sb += w.bian; mb++; }
            if(w.guichu!==undefined){ sg += w.guichu; mg++; }
        });
        return {
            laichu: ml > 0 ? (sl / ml) * 10 : 5,
            xingjing: mx > 0 ? (sx / mx) * 10 : 5,
            bian: mb > 0 ? (sb / mb) * 10 : 5,
            guichu: mg > 0 ? (sg / mg) * 10 : 5
        };
    }

    function countOverlaps(answers) {
        const overlap = {};
        for (let name in memberCoords) overlap[name] = 0;
        for (let ans of answers) {
            if (ans.member && overlap.hasOwnProperty(ans.member)) {
                overlap[ans.member]++;
            }
        }
        return overlap;
    }

    function calculateDistance(user, member) {
        const dl = user.laichu - member.laichu;
        const dx = user.xingjing - member.xingjing;
        const db = user.bian - member.bian;
        const dg = user.guichu - member.guichu;
        return Math.sqrt(dl*dl + dx*dx + db*db + dg*dg);
    }

    function cosineSimilarity(user, member) {
        const u = [user.laichu, user.xingjing, user.bian, user.guichu];
        const m = [member.laichu, member.xingjing, member.bian, member.guichu];
        let dot = 0, normU = 0, normM = 0;
        for (let i = 0; i < 4; i++) {
            dot += u[i] * m[i];
            normU += u[i] * u[i];
            normM += m[i] * m[i];
        }
        if (normU === 0 || normM === 0) return 0;
        return dot / (Math.sqrt(normU) * Math.sqrt(normM));
    }

    // 重合奖励阶梯
    function getOverlapScore(ov) {
        if (ov >= 7) return 100;
        if (ov >= 6) return 85;
        if (ov >= 5) return 65;
        if (ov >= 4) return 40;
        if (ov >= 3) return 20;
        return 0;
    }

    // ========== 多轮投票匹配（第一轮：重合45%+距离55%，取前5；第二轮：余弦相似度取前2；第三轮：纯距离）==========
    function findBestMatchMultiRound(user, answers) {
        const overlap = countOverlaps(answers);
        const names = Object.keys(memberCoords);
        const maxDist = 8; // 归一化常数
        
        // ===== 第一轮：综合评分（重合奖励45% + 维度距离55%），取前5 =====
        let scoreList = [];
        for (let name of names) {
            const member = memberCoords[name];
            const dist = calculateDistance(user, member);
            const ov = overlap[name] || 0;
            const overlapScore = getOverlapScore(ov);
            const distScore = Math.max(0, (1 - dist / maxDist) * 100);
            const totalScore = overlapScore * 0.45 + distScore * 0.55;
            scoreList.push({ name, totalScore, dist, overlap: ov });
        }
        // 按总分降序排序，取前5
        scoreList.sort((a, b) => b.totalScore - a.totalScore);
        const candidatesRound1 = scoreList.slice(0, 5).map(item => item.name);
        
        if (candidatesRound1.length <= 1) {
            return { best: candidatesRound1[0] || "仁俊", score: 0, overlap: 0 };
        }
        
        // ===== 第二轮：余弦相似度筛选，选2个 =====
        let simList = [];
        for (let name of candidatesRound1) {
            const member = memberCoords[name];
            const sim = cosineSimilarity(user, member);
            simList.push({ name, sim });
        }
        simList.sort((a, b) => b.sim - a.sim);
        const candidatesRound2 = simList.slice(0, 2).map(item => item.name);
        
        if (candidatesRound2.length === 1) {
            return { best: candidatesRound2[0], score: 0, overlap: overlap[candidatesRound2[0]] || 0 };
        }
        
        // ===== 第三轮：纯维度距离（不再加重合奖励） =====
        let finalScores = [];
        for (let name of candidatesRound2) {
            const member = memberCoords[name];
            const dist = calculateDistance(user, member);
            const distScore = Math.max(0, (1 - dist / maxDist) * 100);
            finalScores.push({ name, distScore, overlap: overlap[name] || 0 });
        }
        finalScores.sort((a, b) => b.distScore - a.distScore);
        const winner = finalScores[0];
        
        return {
            best: winner.name,
            score: winner.distScore,
            overlap: winner.overlap,
            runnerUp: finalScores.length > 1 ? finalScores[1].name : null,
            runnerUpScore: finalScores.length > 1 ? finalScores[1].distScore : 0
        };
    }

    // ========== 匹配舒适区 + 轻量重合奖励（用于“最match”）==========
    function getMatchBonus(ov) {
        if (ov >= 7) return 2.5;
        if (ov >= 6) return 1.8;
        if (ov >= 5) return 1.2;
        if (ov >= 4) return 0.8;
        if (ov >= 3) return 0.5;
        return 0;
    }

    function findMatchPerson(user, answers) {
        const overlap = countOverlaps(answers);
        const names = Object.keys(memberCoords);
        let best = null;
        let bestScore = -Infinity;

        for (let name of names) {
            const member = memberCoords[name];
            
            const laichuDiff = Math.abs(user.laichu - member.laichu);
            const laichuScore = Math.min(10, laichuDiff * 1.2);
            
            const xingjingDiff = Math.abs(user.xingjing - member.xingjing);
            let xingjingScore = 0;
            if (xingjingDiff <= 3) {
                xingjingScore = xingjingDiff * 1.5;
            } else if (xingjingDiff <= 5) {
                xingjingScore = 5 + (5 - xingjingDiff) * 2.5;
            } else {
                xingjingScore = Math.max(0, 10 - (xingjingDiff - 5) * 1.2);
            }
            xingjingScore = Math.min(10, Math.max(0, xingjingScore));
            
            const bianDiff = Math.abs(user.bian - member.bian);
            let bianScore = 0;
            if (bianDiff <= 3) {
                bianScore = bianDiff * 1.5;
            } else if (bianDiff <= 5) {
                bianScore = 5 + (5 - bianDiff) * 2.5;
            } else {
                bianScore = Math.max(0, 10 - (bianDiff - 5) * 1.2);
            }
            bianScore = Math.min(10, Math.max(0, bianScore));
            
            const guichuDiff = Math.abs(user.guichu - member.guichu);
            const guichuScore = Math.min(10, guichuDiff * 1.2);
            
            const rawScore = laichuScore * 0.20 + xingjingScore * 0.25 + bianScore * 0.25 + guichuScore * 0.30;
            
            const ov = overlap[name] || 0;
            const bonus = getMatchBonus(ov);
            
            const totalScore = rawScore + bonus;
            
            if (totalScore > bestScore) {
                bestScore = totalScore;
                best = name;
            }
        }
        return { best, score: bestScore };
    }

                {key:'bian',label:'变数',left:'守常',right:'逐变',color:'yellow'},
                {key:'guichu',label:'归处',left:'自处',right:'共处',color:'blue'}
            ];
            let dimHtml = '<div class="dim-bar-group">';
            dims.forEach(d=>{
                const val = u[d.key];
                const pct = Math.round(val * 10);
                let leftPct, rightPct, reverse = false;
                if (pct > 50) { leftPct = 100 - pct; rightPct = pct; reverse = true; }
                else { leftPct = pct; rightPct = 100 - pct; reverse = false; }
                const fillClass = d.color === 'yellow' ? 'yellow' : 'blue';
                const reverseClass = reverse ? 'reverse-progress' : '';
                dimHtml += `<div class="dim-item"><div class="dim-label"><span>${d.left} ${leftPct}%</span><span>${rightPct}% ${d.right}</span></div><div class="dim-progress ${reverseClass}"><div class="dim-fill ${fillClass}" style="width:${pct}%"></div></div></div>`;
            });
            dimHtml += '</div>';

            const radarHtml = `<div class="radar-wrap"><canvas id="radarCanvas"></canvas></div>`;

            let matchDesc = '';
            const uGuichu = u.guichu >= 5 ? '共处' : '自处';
            const mGuichu = matchM.guichu >= 5 ? '共处' : '自处';
            if (uGuichu !== mGuichu) {
                matchDesc = `你的「归处」和ta相反——你习惯${uGuichu=='共处'?'有人陪着':'自己消化'}，而ta习惯${mGuichu=='共处'?'有人陪着':'自己消化'}。你们在一起的时候，不会觉得谁欠谁——不需要的时候各自待着，需要的时候会敲门。`;
            } else {
                matchDesc = `你们的「归处」相同——都习惯${uGuichu=='共处'?'有人陪着':'自己消化'}。你们懂得彼此需要什么，在一起时默契，分开时也不慌张。`;
            }

            html = `<div class="result-badge">${mainM.emoji}</div>${easterHtml}<div class="result-name">${main}</div><div class="result-sub">${mainM.title}</div>${secHtml}<div class="result-desc">${mainM.desc}</div><div class="result-tags">${mainM.tags.map(t=>`<span class="result-tag">#${t}</span>`).join('')}</div>${keywordHtml}${anaHtml}${radarHtml}<div style="margin-top:10px;padding:12px 16px;background:rgba(230,245,255,0.5);border-radius:12px;text-align:left;font-size:0.92rem;color:#2a5a6a;line-height:1.8;border-left:3px solid #74DBFF;">💬 ${customAnalysis}</div><div style="margin-top:12px;text-align:left;font-size:0.85rem;color:#8a9aaa;">🔍 与你选择重合较多的成员：${overlapTags}</div>${dimHtml}<div style="margin-top:18px;border-top:2px dashed #e8eef4;padding-top:16px;"><div style="font-size:0.95rem;color:#8a9aaa;margin-bottom:6px;">💚 和你最match的人</div><div style="font-size:1.5rem;font-weight:700;color:#0f2b3b;">${matchPerson} ${matchM.emoji}</div><div style="font-size:0.9rem;color:#6a8a9a;">${matchM.title}</div><div class="result-match" style="margin-top:8px;">${matchDesc}</div></div>`;
        }

        // 分享文字按新格式修改
        const shareText = `六色炸蔬菜测试结果：我最像 ${isSeventh ? '第七种颜色🌈' : main + ' ' + (memberCoords[main]?.emoji || '')}，最match ${isSeventh ? '...' : matchPerson + ' ' + (memberCoords[matchPerson]?.emoji || '')}。来测测你的梦梦人格吧！https://terralunahere.github.io/NCT-DREAM-MEMBERlike/ 🍠 cr TerraLuna YO DREAM 💚`;
        html += `<div style="margin-top:12px;"><textarea class="share-textarea" id="shareText" readonly>${shareText}</textarea><button class="copy-btn" onclick="copyShareText()">复制文案</button></div>`;
        html += `<div class="btn-group"><button class="btn btn-secondary" onclick="confirmRestart()">重新测试</button><button class="btn btn-share" onclick="shareResult()">分享结果</button></div>`;
        document.getElementById('resultContent').innerHTML = html;

        // 绘制雷达图
        radarReady = false;
        setTimeout(() => {
            if (!isSeventh) {
                const mainMember = memberCoords[main];
                const matchMember = memberCoords[matchPerson];
                if (mainMember && matchMember) {
                    const canvas = document.getElementById('radarCanvas');
                    if (canvas) {
                        const ctx = canvas.getContext('2d');
                        const rect = canvas.parentElement.getBoundingClientRect();
                        const size = Math.min(rect.width || 280, 280);
                        canvas.width = size * 2;
                        canvas.height = size * 2;
                        canvas.style.width = size + 'px';
                        canvas.style.height = size + 'px';
                        const w = canvas.width, h = canvas.height;
                        const cx = w/2, cy = h/2;
                        const radius = Math.min(w, h) * 0.38;
                        const dims = ['来处', '行径', '变数', '归处'];
                        const angles = [-Math.PI/2, 0, Math.PI/2, Math.PI];
                        const userVals = [u.laichu/10, u.xingjing/10, u.bian/10, u.guichu/10];
                        const mainVals = [mainMember.laichu/10, mainMember.xingjing/10, mainMember.bian/10, mainMember.guichu/10];
                        const matchVals = [matchMember.laichu/10, matchMember.xingjing/10, matchMember.bian/10, matchMember.guichu/10];
                        ctx.clearRect(0, 0, w, h);
                        for (let r = 0.2; r <= 1; r += 0.2) {
                            ctx.beginPath();
                            for (let i = 0; i < 4; i++) {
                                const x = cx + radius * r * Math.cos(angles[i]);
                                const y = cy + radius * r * Math.sin(angles[i]);
                                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                            }
                            ctx.closePath();
                            ctx.strokeStyle = 'rgba(200,200,200,0.4)';
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        }
                        for (let i = 0; i < 4; i++) {
                            const x = cx + radius * Math.cos(angles[i]);
                            const y = cy + radius * Math.sin(angles[i]);
                            ctx.beginPath();
                            ctx.moveTo(cx, cy);
                            ctx.lineTo(x, y);
                            ctx.strokeStyle = 'rgba(200,200,200,0.6)';
                            ctx.lineWidth = 1;
                            ctx.stroke();
                            const lx = cx + (radius + 24) * Math.cos(angles[i]);
                            const ly = cy + (radius + 24) * Math.sin(angles[i]);
                            ctx.fillStyle = '#4a6a7a';
                            ctx.font = '12px "Gaegu","PingFang SC",sans-serif';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(dims[i], lx, ly);
                        }
                        // 最像（绿色）
                        ctx.beginPath();
                        for (let i = 0; i < 4; i++) {
                            const x = cx + radius * mainVals[i] * Math.cos(angles[i]);
                            const y = cy + radius * mainVals[i] * Math.sin(angles[i]);
                            i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                        }
                        ctx.closePath();
                        ctx.fillStyle = 'rgba(0, 200, 83, 0.12)';
                        ctx.fill();
                        ctx.strokeStyle = '#00C853';
                        ctx.lineWidth = 2.5;
                        ctx.setLineDash([6, 4]);
                        ctx.stroke();
                        ctx.setLineDash([]);
                        for (let i = 0; i < 4; i++) {
                            const x = cx + radius * mainVals[i] * Math.cos(angles[i]);
                            const y = cy + radius * mainVals[i] * Math.sin(angles[i]);
                            ctx.beginPath();
                            ctx.arc(x, y, 4.5, 0, 2*Math.PI);
                            ctx.fillStyle = '#00C853';
                            ctx.fill();
                        }
                        // 最match（黄色）
                        ctx.beginPath();
                        for (let i = 0; i < 4; i++) {
                            const x = cx + radius * matchVals[i] * Math.cos(angles[i]);
                            const y = cy + radius * matchVals[i] * Math.sin(angles[i]);
                            i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                        }
                        ctx.closePath();
                        ctx.fillStyle = 'rgba(255, 224, 0, 0.15)';
                        ctx.fill();
                        ctx.strokeStyle = '#FFE000';
                        ctx.lineWidth = 2.5;
                        ctx.setLineDash([4, 4]);
                        ctx.stroke();
                        ctx.setLineDash([]);
                        for (let i = 0; i < 4; i++) {
                            const x = cx + radius * matchVals[i] * Math.cos(angles[i]);
                            const y = cy + radius * matchVals[i] * Math.sin(angles[i]);
                            ctx.beginPath();
                            ctx.arc(x, y, 4.5, 0, 2*Math.PI);
                            ctx.fillStyle = '#FFE000';
                            ctx.fill();
                        }
                        // 用户（蓝色）
                        ctx.beginPath();
                        for (let i = 0; i < 4; i++) {
                            const x = cx + radius * userVals[i] * Math.cos(angles[i]);
                            const y = cy + radius * userVals[i] * Math.sin(angles[i]);
                            i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                        }
                        ctx.closePath();
                        ctx.fillStyle = 'rgba(34, 195, 255, 0.18)';
                        ctx.fill();
                        ctx.strokeStyle = '#22C3FF';
                        ctx.lineWidth = 2.5;
                        ctx.stroke();
                        for (let i = 0; i < 4; i++) {
                            const x = cx + radius * userVals[i] * Math.cos(angles[i]);
                            const y = cy + radius * userVals[i] * Math.sin(angles[i]);
                            ctx.beginPath();
                            ctx.arc(x, y, 5, 0, 2*Math.PI);
                            ctx.fillStyle = '#22C3FF';
                            ctx.fill();
                        }
                        const legendY = h - 50;
                        const legendX = 20;
                        ctx.font = '12px "Gaegu","PingFang SC",sans-serif';
                        ctx.textAlign = 'left';
                        ctx.textBaseline = 'bottom';
                        ctx.fillStyle = '#22C3FF';
                        ctx.fillRect(legendX, legendY - 18, 14, 14);
                        ctx.fillStyle = '#1e3a4a';
                        ctx.fillText('你', legendX + 20, legendY);
                        ctx.fillStyle = '#00C853';
                        ctx.fillRect(legendX + 70, legendY - 18, 14, 14);
                        ctx.fillStyle = '#1e3a4a';
                        ctx.fillText('最像', legendX + 90, legendY);
                        ctx.fillStyle = '#FFE000';
                        ctx.fillRect(legendX + 140, legendY - 18, 14, 14);
                        ctx.fillStyle = '#1e3a4a';
                        ctx.fillText('最match', legendX + 160, legendY);
                    }
                }
            }
            radarReady = true;
        }, 300);
    }

    function confirmRestart() {
        if (confirm('确定要重新测试吗？当前结果将丢失。')) {
            restartTest();
        }
    }

    function restartTest(){document.getElementById('resultBox').style.display='none';document.getElementById('testBox').style.display='block';currentIndex=0;answers=[];renderQuestion();}

    function copyShareText() {
        const ta = document.getElementById('shareText');
        if (ta) {
            ta.select();
            document.execCommand('copy');
            alert('文案已复制！');
        }
    }

    function shareResult() {
        const el = document.getElementById('resultContent');
        if (!el) return;
        if (!radarReady) {
            alert('结果正在生成中，请稍后再试');
            return;
        }
        const wrapper = document.createElement('div');
        wrapper.style.cssText = 'background:#FFFDE8;padding:20px;border-radius:16px;width:500px;margin:0 auto;font-family:"PingFang SC","Microsoft YaHei",sans-serif;';
        const content = el.cloneNode(true);
        content.style.width = '500px';
        content.style.maxWidth = '500px';
        content.style.margin = '0 auto';
        const btns = content.querySelector('.btn-group');
        if (btns) btns.remove();
        const textarea = content.querySelector('.share-textarea');
        if (textarea) textarea.remove();
        const copyBtn = content.querySelector('.copy-btn');
        if (copyBtn) copyBtn.remove();
        wrapper.appendChild(content);
        const cr = document.createElement('div');
        cr.style.cssText = 'text-align:center;font-size:.8rem;color:#888;margin-top:12px;font-family:"Gaegu","PingFang SC",sans-serif;';
        cr.textContent = '🍠 cr TerraLuna YO DREAM 💚';
        wrapper.appendChild(cr);
        document.body.appendChild(wrapper);
        html2canvas(wrapper, {
            scale: 2,
            backgroundColor: '#FFFDE8',
            logging: false,
            allowTaint: true,
            useCORS: true,
            width: 500,
            height: wrapper.scrollHeight
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = '六色炸蔬菜_结果.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            document.body.removeChild(wrapper);
        }).catch(() => {
            document.body.removeChild(wrapper);
            alert('生成图片失败，请尝试截图保存');
        });
    }

    document.addEventListener('DOMContentLoaded',function(){
        document.getElementById('startBtn').addEventListener('click',startTest);
        document.getElementById('nextBtn').addEventListener('click',nextQuestion);
    });
    window.startTest=startTest;window.nextQuestion=nextQuestion;window.restartTest=restartTest;window.shareResult=shareResult;window.confirmRestart=confirmRestart;window.copyShareText=copyShareText;
</script>
</body>
</html>
